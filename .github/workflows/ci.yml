name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python3 -W ignore -m unittest discover -s device/agent
      - run: bash -n deploy/pi/install.sh && bash -n deploy/pi/install-dynatrace.sh && bash -n device/kiosk/kiosk-session.sh

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for the Pi (arm64) to prove the image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
